<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page not found | Shohanur Nishad</title>
  <link rel="canonical" href="https://s-nishad.github.io/">
  <link rel="shortcut icon" href="./assets/images/image.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme = (!stored || stored === "system") ? "dark" : stored;
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <style>
    :root {
      --bg: hsl(210, 28%, 7%);
      --card: hsl(210, 24%, 10%);
      --text: hsl(210, 20%, 97%);
      --muted: hsl(210, 16%, 70%);
      --accent: hsl(168, 70%, 48%);
      --border: hsl(210, 14%, 26%);
    }

    :root[data-theme="light"] {
      --bg: hsl(240, 5%, 96%);
      --card: hsl(0, 0%, 100%);
      --text: hsl(240, 8%, 6%);
      --muted: hsl(240, 5%, 28%);
      --accent: hsl(168, 70%, 36%);
      --border: hsl(240, 5%, 87%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 28px hsla(210, 30%, 2%, 0.18);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.8rem, 8vw, 4rem);
      color: var(--accent);
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.6;
    }

    .blackhole-img {
      display: block;
      margin: 0 auto 20px auto;
      width: 120px;
      height: 120px;
      animation: spin 6s linear infinite;
      filter: drop-shadow(0 0 10px var(--accent));
    }
    @keyframes spin {
      100% { transform: rotate(360deg);}
    }
    
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 24px;
    }

    a.button {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: 500;
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
      transition: 0.2s ease;
    }

    a.button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    a.button:hover {
      transform: translateY(-1px);
    }

    a.button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>404</h1>
    <!-- Inline SVG for black hole to ensure it always loads -->
    <svg class="blackhole-img" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="A swirling black hole">
      <defs>
        <radialGradient id="bh-gradient" cx="50%" cy="50%" r="50%">
          <stop offset="25%" stop-color="#2af5c4"/>
          <stop offset="50%" stop-color="#18a98b"/>
          <stop offset="95%" stop-color="#222"/>
        </radialGradient>
      </defs>
      <circle cx="64" cy="64" r="56" fill="url(#bh-gradient)" opacity="0.7"/>
      <ellipse cx="64" cy="64" rx="32" ry="42" fill="#181a1f" opacity="0.85"/>
      <circle cx="64" cy="64" r="20" fill="#111" />
      <ellipse cx="64" cy="64" rx="32" ry="12" fill="#19f5c4" opacity="0.2"/>
      <ellipse cx="64" cy="64" rx="46" ry="12" fill="#2af5c4" opacity="0.11"/>
      <ellipse cx="64" cy="74" rx="10" ry="2" fill="#fff" opacity="0.12"/>
      <ellipse cx="58" cy="61" rx="5" ry="3" fill="#42fff9" opacity="0.21"/>
      <ellipse cx="75" cy="65" rx="4" ry="2" fill="#fff" opacity="0.11"/>
    </svg>
    <p style="font-size:1.15em;color:var(--accent);margin-bottom: 14px;">
      Oops! You’ve wandered into a black hole.<br>
    </p>
    <p>But don’t worry, the spaceship is still here.</p>
    <p style="font-style:italic;color:var(--muted);margin-bottom:19px;">
      Choose your escape route:
    </p>
    <div class="actions">
      <a class="button primary" href="https://s-nishad.github.io/">Return Home</a>
      <a class="button" href="https://s-nishad.github.io/devhacks/hacks/">Return to Hacks</a>
    </div>
    <p style="color: var(--muted); margin-top: 32px; font-size:0.98em;">
      Or just float peacefully and ponder the mysteries of the universe.<br>
      (Fun fact: There's a secret wormhole here, but it's <strong>really</strong> hard to spot!)
    </p>
  </main>
</body>

</html>
